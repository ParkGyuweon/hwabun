name: hwabun-ec2-2

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

x-spark-runtime: &spark-runtime
  image: hwabun-ec2-2-spark:3.5.6
  build:
    context: ../../infra/spark
    args:
      SPARK_VERSION: "3.5.6"
  working_dir: /opt/project
  restart: unless-stopped
  logging: *logging

x-spark-volumes: &spark-volumes
  - ../../streaming:/opt/project/streaming:ro
  - ../../contracts:/opt/project/contracts:ro
  - ../../batch:/opt/project/batch:ro
  - ../../frontend:/opt/project/frontend:ro
  - ${SPARK_DATA_PATH:-/opt/hwabun/data}:/opt/project/data
  - spark-events:/opt/spark-events
  - spark-ivy-cache:/opt/spark/.ivy2

services:
  kafka:
    image: apache/kafka:4.2.0
    hostname: kafka
    restart: unless-stopped
    logging: *logging
    ports:
      - "${KAFKA_BIND_IP:-0.0.0.0}:9092:9092"
    environment:
      KAFKA_NODE_ID: "1"
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: INTERNAL://:19092,CONTROLLER://:9093,EXTERNAL://:9092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:19092,EXTERNAL://${KAFKA_ADVERTISED_HOST:?Set EC2-2 reachable IP or DNS in .env}:9092
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      CLUSTER_ID: ${KAFKA_KRAFT_CLUSTER_ID:-4L6g3nShT-eMCtK--X86sw}
      KAFKA_NUM_PARTITIONS: ${ACTIVITY_EVENTS_PARTITIONS:-3}
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_DEFAULT_REPLICATION_FACTOR: "1"
      KAFKA_MIN_INSYNC_REPLICAS: "1"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_MIN_ISR: "1"
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: "0"
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_HEAP_OPTS: ${KAFKA_HEAP_OPTS:--Xms512m -Xmx1g}
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: [CMD-SHELL, "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server kafka:19092 >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  kafka-init:
    image: apache/kafka:4.2.0
    restart: "no"
    logging: *logging
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      ACTIVITY_EVENTS_TOPIC: ${ACTIVITY_EVENTS_TOPIC:-activity-events}
      ACTIVITY_EVENTS_PARTITIONS: ${ACTIVITY_EVENTS_PARTITIONS:-3}
      KAFKA_TOPIC_RETENTION_MS: ${KAFKA_TOPIC_RETENTION_MS:-259200000}
    entrypoint: [/bin/bash, -ec]
    command:
      - |
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:19092 \
          --create --if-not-exists --topic "$$ACTIVITY_EVENTS_TOPIC" \
          --partitions "$$ACTIVITY_EVENTS_PARTITIONS" --replication-factor 1 \
          --config cleanup.policy=delete --config "retention.ms=$$KAFKA_TOPIC_RETENTION_MS"
        # --if-not-exists leaves an existing topic untouched, so re-apply retention
        # explicitly. Idempotent: same value -> no-op on the broker.
        /opt/kafka/bin/kafka-configs.sh --bootstrap-server kafka:19092 \
          --alter --entity-type topics --entity-name "$$ACTIVITY_EVENTS_TOPIC" \
          --add-config "retention.ms=$$KAFKA_TOPIC_RETENTION_MS"
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:19092 \
          --describe --topic "$$ACTIVITY_EVENTS_TOPIC"

  spark-master:
    <<: *spark-runtime
    hostname: spark-master
    entrypoint: [/opt/spark/bin/spark-class]
    command: [org.apache.spark.deploy.master.Master]
    environment:
      SPARK_MASTER_HOST: spark-master
      SPARK_MASTER_PORT: "7077"
      SPARK_MASTER_WEBUI_PORT: "8080"
      COMMONS_HASH_SALT: ${COMMONS_HASH_SALT:-}
    ports:
      - "${SPARK_MASTER_UI_BIND_IP:-127.0.0.1}:18080:8080"
    volumes: *spark-volumes
    healthcheck:
      test: [CMD-SHELL, "bash -c '</dev/tcp/127.0.0.1/8080'"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  spark-worker:
    <<: *spark-runtime
    entrypoint: [/opt/spark/bin/spark-class]
    command: [org.apache.spark.deploy.worker.Worker, "spark://spark-master:7077"]
    environment:
      SPARK_WORKER_CORES: ${SPARK_WORKER_CORES:-2}
      SPARK_WORKER_MEMORY: ${SPARK_WORKER_MEMORY:-2g}
      SPARK_WORKER_WEBUI_PORT: "8081"
      COMMONS_HASH_SALT: ${COMMONS_HASH_SALT:-}
    depends_on:
      spark-master:
        condition: service_healthy
    volumes: *spark-volumes
    healthcheck:
      test: [CMD-SHELL, "bash -c '</dev/tcp/127.0.0.1/8081'"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  spark-history:
    <<: *spark-runtime
    entrypoint: [/opt/spark/bin/spark-class]
    command: [org.apache.spark.deploy.history.HistoryServer]
    environment:
      SPARK_HISTORY_OPTS: >-
        -Dspark.history.fs.logDirectory=file:/opt/spark-events
        -Dspark.history.ui.port=18080
    ports:
      - "127.0.0.1:18081:18080"
    volumes:
      - spark-events:/opt/spark-events
    healthcheck:
      test: [CMD-SHELL, "bash -c '</dev/tcp/127.0.0.1/18080'"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  spark-raw-sink:
    <<: *spark-runtime
    restart: unless-stopped
    entrypoint: [/opt/spark/bin/spark-submit]
    command:
      - --master
      - spark://spark-master:7077
      - --deploy-mode
      - client
      - --packages
      - org.apache.spark:spark-sql-kafka-0-10_2.12:3.5.6
      - --conf
      - spark.jars.ivy=/opt/spark/.ivy2
      - --conf
      - spark.cores.max=1
      - --conf
      - spark.driver.host=spark-raw-sink
      - --conf
      - spark.driver.bindAddress=0.0.0.0
      - /opt/project/streaming/jobs/raw_sink_job.py
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:19092
      ACTIVITY_EVENTS_TOPIC: ${ACTIVITY_EVENTS_TOPIC:-activity-events}
      KAFKA_CLUSTER_ID: ${KAFKA_SOURCE_CLUSTER_ID:-ec2-2}
      RAW_EVENTS_PATH: /opt/project/data/raw_events
      RAW_EVENTS_CHECKPOINT_PATH: /opt/project/data/checkpoints/raw-events
      RAW_EVENTS_STARTING_OFFSETS: ${RAW_EVENTS_STARTING_OFFSETS:-earliest}
      RAW_EVENTS_TRIGGER_INTERVAL: ${RAW_EVENTS_TRIGGER_INTERVAL:-10 seconds}
    depends_on:
      kafka-init:
        condition: service_completed_successfully
      spark-master:
        condition: service_healthy
      spark-worker:
        condition: service_healthy
    volumes: *spark-volumes

  # Explicit one-shot publication after Q4/Q5; ordinary up does not run this.
  dw-projection:
    profiles: [dw]
    build:
      context: ../../streaming
      dockerfile: Dockerfile.dw
    restart: "no"
    logging: *logging
    environment:
      DW_MYSQL_HOST: ${DW_MYSQL_HOST:-}
      DW_MYSQL_PORT: ${DW_MYSQL_PORT:-13306}
      DW_MYSQL_DB: ${DW_MYSQL_DB:-dw}
      DW_MYSQL_USER: ${DW_MYSQL_USER:-}
      DW_MYSQL_PASSWORD: ${DW_MYSQL_PASSWORD:-}
      DW_PROJECTION_MARTS: ${DW_PROJECTION_MARTS:-user_trait_daily,brand_daily_kpi,product_daily_kpi,funnel_daily_kpi,brand_repurchase_daily,product_repurchase_daily,purchase_reason_daily,persona_segment_daily_kpi,brand_price_band_daily_kpi,segment_price_band_daily_kpi,brand_cohort_dim,commons_cohort_weekly,ingredient_weekly_interest,product_exit_daily,segment_content_daily,friction_daily,exit_daily,entry_source_daily,content_daily_kpi,content_conversion_daily,behavior_conversion_daily,event_daily}
    volumes:
      - ${SPARK_DATA_PATH:-/opt/hwabun/data}:/data:ro
      - ../../contracts:/app/contracts:ro
      - dw-projection-reports:/reports
    command:
      - --marts
      - ${DW_PROJECTION_MARTS:-user_trait_daily,brand_daily_kpi,product_daily_kpi,funnel_daily_kpi,brand_repurchase_daily,product_repurchase_daily,purchase_reason_daily,persona_segment_daily_kpi,brand_price_band_daily_kpi,segment_price_band_daily_kpi,brand_cohort_dim,commons_cohort_weekly,ingredient_weekly_interest,product_exit_daily,segment_content_daily,friction_daily,exit_daily,entry_source_daily,content_daily_kpi,content_conversion_daily,behavior_conversion_daily,event_daily}
      - --source-root
      - /data/marts
      - --report-path
      - /reports/dw-projection.json

volumes:
  kafka-data:
    name: ${KAFKA_DATA_VOLUME:-hwabun-ec2-2-kafka-data}
  spark-events:
  spark-ivy-cache:
  dw-projection-reports:
