# Rate limit for the two endpoints that spend money per request (LLM sentences, Jira 365).
# 6 requests/minute per client IP. One dashboard screen asks once per screen and the server
# caches by input hash, so a real seller never reaches this; a loop or a scraper does.
limit_req_zone $binary_remote_addr zone=llm_sentences:1m rate=6r/m;

server {
    listen 80;
    server_name j15a306.p.ssafy.io;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name j15a306.p.ssafy.io;

    ssl_certificate /etc/letsencrypt/live/j15a306.p.ssafy.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/j15a306.p.ssafy.io/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    root /usr/share/nginx/html;
    index index.html;

    # Security headers. Set once here; every location below inherits them because no
    # location defines its own add_header. A location that adds ANY add_header drops all
    # of these - repeat them there if that is ever needed.
    #
    # X-Frame-Options SAMEORIGIN: the only frame of this site is the dashboard register
    # preview (/?product=DRAFT&preview=1, same origin). PortOne/KakaoPay frames are their
    # pages inside ours, which this header does not affect; the mobile REDIRECTION flow
    # comes back as a top-level navigation. /live/users (PiP) is served by the recommend
    # server, not through this nginx, and uses documentPictureInPicture, not an iframe.
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    # Only features this site never uses. payment / fullscreen / picture-in-picture are
    # deliberately not listed so the PortOne (KakaoPay) frame is not restricted.
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), usb=(), browsing-topics=()" always;
    # TLS terminates in this server block (certbot certificate above). max-age is one day
    # on purpose: if certificate renewal ever breaks, browsers stay locked to HTTPS for at
    # most a day. No includeSubDomains/preload. Raise to 31536000 once renewals are proven.
    add_header Strict-Transport-Security "max-age=86400" always;
    # CSP is REPORT-ONLY: the browser blocks nothing and only prints violations in the
    # console. Origins the built pages actually use:
    #   cdn.portone.io              PortOne browser SDK loader (@portone/browser-sdk/v2)
    #   *.portone.io, *.iamport.co  PortOne checkout frames and API
    #   *.kakaopay.com, *.kakao.com KakaoPay pages inside the PortOne frame
    #   cdn.jsdelivr.net            Pretendard font CSS + woff2 (dashboard.html)
    #   https: for img              Sephora product image CDN + seller-entered image URLs
    # Switch to the enforcing header only after the console shows no violations on the
    # shop, dashboard, platform and KakaoPay flows.
    add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self' https://cdn.portone.io; style-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; font-src 'self' data: https://cdn.jsdelivr.net; img-src 'self' data: blob: https:; connect-src 'self' https://*.portone.io https://*.iamport.co; frame-src 'self' https://*.portone.io https://*.iamport.co https://*.kakaopay.com https://*.kakao.com; form-action 'self' https://*.portone.io https://*.iamport.co https://*.kakaopay.com; object-src 'none'; base-uri 'self'; frame-ancestors 'self'" always;

    # The log collector exposes only POST /api/events.
    location = /api/events {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    # Dashboard sentences are answered by the recommend server (8300), not Shop Backend.
    # Without these two exact-match blocks the requests fall through to /api/ -> 8090,
    # which has no handler for them, so the dashboard has been getting 404 in the
    # deployed site while working locally through the Vite proxy (Jira 365).
    #
    # Only these two paths are opened. The switch endpoints (/api/prescription/llm) stay
    # closed - they turn paid LLM calls on and off and have no authentication.
    # Both handlers call a paid LLM, so requests are rate limited per client IP and the
    # server serves a stored answer for a repeated input. The durable fix is a
    # server-to-server call from Shop Backend with the dashboard session, the way
    # /api/feedback/classify (Jira 353) is built; this block is what makes the screen
    # work until that exists.
    location = /api/prescription {
        limit_req zone=llm_sentences burst=5 nodelay;
        proxy_pass http://recommend:8300;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 60s;
    }

    location = /api/headline {
        limit_req zone=llm_sentences burst=5 nodelay;
        proxy_pass http://recommend:8300;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 60s;
    }

    # All other API requests belong to Shop Backend.
    location /api/ {
        proxy_pass http://shop-backend:8090;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
