global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: log-connector
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["backend:8080"]
        labels:
          environment: ec2
  - job_name: shop-backend
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["shop-backend:8090"]
        labels:
          environment: ec2
