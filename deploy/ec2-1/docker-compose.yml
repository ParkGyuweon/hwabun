services:
  backend:
    build:
      context: ../..
      dockerfile: deploy/backend.Dockerfile
    restart: unless-stopped
    environment:
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS:?Set KAFKA_BOOTSTRAP_SERVERS in .env}
      ACTIVITY_EVENTS_TOPIC: ${ACTIVITY_EVENTS_TOPIC:-activity-events}
      ACTIVITY_EVENTS_PARTITIONS: ${ACTIVITY_EVENTS_PARTITIONS:-3}
      CREATE_ACTIVITY_EVENTS_TOPIC: "false"
      RECOMMEND_URL: ${RECOMMEND_URL:-http://recommend:8300}
    expose:
      - "8080"
    mem_limit: 1g

  # 추천 추론 서버 (AI, 계약 §5). 백엔드가 RECOMMEND_URL=http://recommend:8300 으로 프록시한다.
  # 외부 포트는 열지 않는다 — 인증이 없어 내부 네트워크 전용. 상태는 메모리 + /data 볼륨(등록 상품).
  # WORKERS 는 1 로 둔다: 사용자 상태·등록 상품이 프로세스 메모리라 워커를 늘리면 서로 다른 답을 낸다.
  recommend:
    build:
      context: ../..
      dockerfile: deploy/recommend.Dockerfile
    restart: unless-stopped
    environment:
      PORT: "8300"
      WORKERS: "1"
      REGISTERED_PRODUCTS_PATH: /data/registered_products.jsonl
      PRESCRIPTIONS_PATH: /data/prescriptions.jsonl
      SESSION_EVENTS_PATH: /data/session_events.jsonl    # 세션 상태 이벤트 로그 (Jira 224) — 재시작 시 재생
      GMS_KEY: ${GMS_KEY:-}                      # 처방 문장 생성 (없으면 /api/prescription 만 503)
      SHOP_BACKEND_URL: ${SHOP_BACKEND_URL:-}    # 쇼핑몰 백엔드 카탈로그 동기화 (Jira 222). 비우면 안 함
      CATALOG_SYNC_INTERVAL_SEC: ${CATALOG_SYNC_INTERVAL_SEC:-300}
    volumes:
      - recommend-data:/data
    expose:
      - "8300"
    mem_limit: 1g

  nginx:
    build:
      context: ../..
      dockerfile: deploy/nginx.Dockerfile
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - type: bind
        source: ${CERTBOT_WEBROOT_PATH:-/opt/hwabun/certbot/www}
        target: /var/www/certbot
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${LETSENCRYPT_PATH:-/etc/letsencrypt}
        target: /etc/letsencrypt
        read_only: true
        bind:
          create_host_path: false
    mem_limit: 128m

  prometheus:
    image: prom/prometheus:v3.5.0
    restart: unless-stopped
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=7d
    mem_limit: 512m

  grafana:
    image: grafana/grafana:12.1.0
    restart: unless-stopped
    depends_on:
      - prometheus
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?Set GRAFANA_ADMIN_PASSWORD in .env}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana-data:/var/lib/grafana
      - ../../monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ../../monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    mem_limit: 384m

volumes:
  prometheus-data:
  grafana-data:
  recommend-data:
