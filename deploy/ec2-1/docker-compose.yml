services:
  backend:
    build:
      context: ../..
      dockerfile: deploy/backend.Dockerfile
    restart: unless-stopped
    environment:
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS:?Set KAFKA_BOOTSTRAP_SERVERS in .env}
      ACTIVITY_EVENTS_TOPIC: ${ACTIVITY_EVENTS_TOPIC:-activity-events}
      ACTIVITY_EVENTS_PARTITIONS: ${ACTIVITY_EVENTS_PARTITIONS:-3}
      CREATE_ACTIVITY_EVENTS_TOPIC: "false"
      RECOMMEND_URL: ${RECOMMEND_URL:-http://recommend:8300}
    expose:
      - "8080"
    mem_limit: 1g

  # 추천 추론 서버 (AI, 계약 §5). 백엔드가 RECOMMEND_URL=http://recommend:8300 으로 프록시한다.
  # 외부 포트는 열지 않는다 — 인증이 없어 내부 네트워크 전용. 상태는 메모리 + /data 볼륨(등록 상품).
  # WORKERS 는 1 로 둔다: 사용자 상태·등록 상품이 프로세스 메모리라 워커를 늘리면 서로 다른 답을 낸다.
  recommend:
    build:
      context: ../..
      dockerfile: deploy/recommend.Dockerfile
    restart: unless-stopped
    environment:
      PORT: "8300"
      WORKERS: "1"
      REGISTERED_PRODUCTS_PATH: /data/registered_products.jsonl
      PRESCRIPTIONS_PATH: /data/prescriptions.jsonl
      SESSION_EVENTS_PATH: /data/session_events.jsonl    # 세션 상태 이벤트 로그 (Jira 224) — 재시작 시 재생
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS:-}   # 행동 이벤트 구독 (Jira 226). 비우면 구독 안 함
      ACTIVITY_EVENTS_TOPIC: ${ACTIVITY_EVENTS_TOPIC:-activity-events}
      RECOMMEND_STATE_GROUP: recommend-state-v1          # Spark 와 다른 consumer group — 같은 이벤트를 독립적으로 읽는다
      GMS_KEY: ${GMS_KEY:-}                      # 처방 문장 생성 (없으면 /api/prescription 만 503)
      SHOP_BACKEND_URL: ${SHOP_BACKEND_URL:-}    # 쇼핑몰 백엔드 카탈로그 동기화 (Jira 222). 비우면 안 함
      CATALOG_SYNC_INTERVAL_SEC: ${CATALOG_SYNC_INTERVAL_SEC:-300}
      NEW_BRAND_DAYS: ${NEW_BRAND_DAYS:-14}                 # 신규 브랜드 = 등록 후 N일 (Jira 247-b, 2026-09-11 결정)
      # 장기 성향 long_term_trait (Jira 306). EC2-1 shop-backend-mysql의 dw projection을 읽는다.
      # 비우면 /data/user_trait_snapshot.jsonl → 이미지 안 스냅샷 → 없으면 응답 null.
      DW_MYSQL_HOST: ${DW_MYSQL_HOST:-shop-backend-mysql}
      DW_MYSQL_PORT: ${DW_MYSQL_PORT:-3306}
      DW_MYSQL_USER: ${DW_MYSQL_USER:-}
      DW_MYSQL_PASSWORD: ${DW_MYSQL_PASSWORD:-}
      DW_MYSQL_DB: ${DW_MYSQL_DB:-dw}
      USER_TRAIT_RELOAD_SEC: ${USER_TRAIT_RELOAD_SEC:-300}
      PRESCRIPTION_LLM: ${PRESCRIPTION_LLM:-on}                # 처방 LLM(GMS 과금) 스위치. off 면 규칙표 문장. 런타임 토글 POST /api/prescription/llm (Jira 325)
      USER_TRAIT_STALE_DAYS: ${USER_TRAIT_STALE_DAYS:-2}        # health.stale 경보선 (Jira 319)
      USER_TRAIT_MAX_AGE_DAYS: ${USER_TRAIT_MAX_AGE_DAYS:-14}   # 넘으면 long_term_trait null
      NEW_BRAND_ALWAYS_PREFIX: ${NEW_BRAND_ALWAYS_PREFIX:-SB}   # 기간 무관 신규로 둘 product_id 접두. SB = 시연 브랜드 SSAFY Beauty 8개 (2026-09-14 결정, Jira 249). 비우려면 .env 에 빈 값
      # /live 시작 버튼(Jira 295·335): 생성기가 페르소나 1명당 RSS 1.2MB 라 9,900명은 12GB — 컨테이너에선 1,000명(1.2GB·714MB·20초).
      # 캐시는 볼륨에 두어 재배포해도 다시 만들지 않는다.
      DEMO_LIMIT: ${DEMO_LIMIT:-1000}
      DEMO_CACHE_DIR: /data/demo_cache
      # /pipeline 화면 (Jira 337, 읽기만). Spark UI 는 EC2-2 가 127.0.0.1:18080 에만 열어 두어 개방 요청 뒤 .env 에
      SPARK_MASTER_UI: ${SPARK_MASTER_UI:-}
      DASHBOARD_URL: ${DASHBOARD_URL:-}
    volumes:
      - recommend-data:/data
    networks:
      - default
      - shop-backend-db
    expose:
      - "8300"
    mem_limit: 3g          # 1g 였다 — /live 첫 시작의 1,000명 생성(RSS 1.2GB)이 서버(0.5GB)와 함께 들어가야 한다 (09-16 OOM 실측)

  nginx:
    build:
      context: ../..
      dockerfile: deploy/nginx.Dockerfile
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - type: bind
        source: ${CERTBOT_WEBROOT_PATH:-/opt/hwabun/certbot/www}
        target: /var/www/certbot
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${LETSENCRYPT_PATH:-/etc/letsencrypt}
        target: /etc/letsencrypt
        read_only: true
        bind:
          create_host_path: false
    mem_limit: 128m

  prometheus:
    image: prom/prometheus:v3.5.0
    restart: unless-stopped
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=7d
    mem_limit: 512m

  grafana:
    image: grafana/grafana:12.1.0
    restart: unless-stopped
    depends_on:
      - prometheus
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?Set GRAFANA_ADMIN_PASSWORD in .env}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana-data:/var/lib/grafana
      - ../../monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ../../monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    mem_limit: 384m

volumes:
  prometheus-data:
  grafana-data:
  recommend-data:

networks:
  # shop_backend/docker-compose.mysql.yml creates this named network.
  # It must exist before this Compose project is started.
  default:
  shop-backend-db:
    external: true
    name: shop-backend-db
