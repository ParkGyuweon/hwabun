services:
  backend:
    build:
      context: ../..
      dockerfile: deploy/backend.Dockerfile
    restart: unless-stopped
    environment:
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS:?Set KAFKA_BOOTSTRAP_SERVERS in .env}
      ACTIVITY_EVENTS_TOPIC: ${ACTIVITY_EVENTS_TOPIC:-activity-events}
      ACTIVITY_EVENTS_PARTITIONS: ${ACTIVITY_EVENTS_PARTITIONS:-3}
      CREATE_ACTIVITY_EVENTS_TOPIC: "false"
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:?Set ALLOWED_ORIGINS in .env}
      SHOP_BACKEND_JWT_SECRET: ${SHOP_BACKEND_JWT_SECRET:?Set SHOP_BACKEND_JWT_SECRET in .env}
      RECOMMEND_URL: ${RECOMMEND_URL:-http://recommend:8300}
    expose:
      - "8080"
    mem_limit: 1g

  shop-backend:
    build:
      context: ../..
      dockerfile: deploy/shop_backend.Dockerfile
    restart: unless-stopped
    environment:
      SERVER_PORT: "8090"
      SHOP_BACKEND_JWT_SECRET: ${SHOP_BACKEND_JWT_SECRET:?Set SHOP_BACKEND_JWT_SECRET in .env}
      SHOP_BACKEND_JWT_EXPIRATION_MS: ${SHOP_BACKEND_JWT_EXPIRATION_MS:-86400000}
      SHOP_BACKEND_MYSQL_URL: jdbc:mysql://mysql:3306/${MYSQL_DATABASE:-shop_backend}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Seoul&connectionTimeZone=Asia/Seoul&forceConnectionTimeZoneToSession=true
      SHOP_BACKEND_MYSQL_USER: ${MYSQL_USER:-shop_backend}
      SHOP_BACKEND_MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in .env}
      DASHBOARD_MART_MYSQL_URL: jdbc:mysql://${DW_MYSQL_HOST:-mysql}:${DW_MYSQL_PORT:-3306}/${DW_MYSQL_DB:-dw}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Seoul
      DW_MYSQL_USER: ${DW_MYSQL_USER:-}
      DW_MYSQL_PASSWORD: ${DW_MYSQL_PASSWORD:-}
      PORTONE_API_SECRET: ${PORTONE_API_SECRET:?Set PORTONE_API_SECRET in .env}
      PORTONE_API_URL: ${PORTONE_API_URL:-https://api.portone.io}
      PORTONE_TIMEOUT_MS: ${PORTONE_TIMEOUT_MS:-10000}
      # 결제 대조(confirm 누락 주문을 PortOne 재조회로 PAID 처리). 5분마다, 생성 2분~24시간 CREATED 주문.
      SHOP_PAYMENT_RECONCILE_ENABLED: ${SHOP_PAYMENT_RECONCILE_ENABLED:-true}
      SHOP_PAYMENT_RECONCILE_INTERVAL_MS: ${SHOP_PAYMENT_RECONCILE_INTERVAL_MS:-300000}
      RECOMMEND_URL: ${RECOMMEND_URL:-http://recommend:8300}
      # 추천 API 응답 대기(ms). 너무 짧으면 프론트가 조용히 예시 추천으로 바뀐다
      RECOMMEND_TIMEOUT_MS: ${RECOMMEND_TIMEOUT_MS:-1500}
      DEPLOYMENT_ENVIRONMENT: ${DEPLOYMENT_ENVIRONMENT:-ec2}
      # 결제 없이 PAID 로 표시하는 테스트 주문(/api/orders/{id}/pay)을 부를 수 있는 회원 ID 접두.
      # 에이전트 러너 계정(PA00001~PA00100, 시드 shop_backend_seed.sql)만 허용한다.
      # 프론트의 ?pay=test 판정은 보호 장치가 아니라 러너 분기일 뿐이라 실제 차단은 서버가 한다.
      TEST_PAY_ALLOWED_MEMBER_PREFIX: ${TEST_PAY_ALLOWED_MEMBER_PREFIX:-PA}
    depends_on:
      mysql:
        condition: service_healthy
    expose:
      - "8090"
    mem_limit: 1g

  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-shop_backend}
      MYSQL_USER: ${MYSQL_USER:-shop_backend}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in .env}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in .env}
    volumes:
      - mysql-data:/var/lib/mysql
      - ../../shop_backend/mysql-erd.sql:/docker-entrypoint-initdb.d/001-mysql-erd.sql:ro
      - ../../shop_backend/seed/shop_backend_seed.sql:/docker-entrypoint-initdb.d/002-shop-backend-seed.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    # 로컬 관리·SSH 터널용 포트는 계속 loopback에만 둔다.
    ports:
      - "127.0.0.1:3306:3306"
      # EC2-2 Spark/DW 작업은 EC2-1 사설망 주소의 13306으로만 접속한다.
      # 기본값도 loopback이므로 .env에서 사설 IP를 명시하기 전에는 외부에 열리지 않는다.
      - "${SHOP_BACKEND_MYSQL_BIND_ADDRESS:-127.0.0.1}:${SHOP_BACKEND_MYSQL_PORT:-13306}:3306"
    mem_limit: 1g

  # 추천 추론 서버 (AI, 계약 §5). 백엔드가 RECOMMEND_URL=http://recommend:8300 으로 프록시한다.
  # 외부 포트는 열지 않는다 — 인증이 없어 내부 네트워크 전용. 상태는 메모리 + /data 볼륨(등록 상품).
  # WORKERS 는 1 로 둔다: 사용자 상태·등록 상품이 프로세스 메모리라 워커를 늘리면 서로 다른 답을 낸다.
  recommend:
    build:
      context: ../..
      dockerfile: deploy/recommend.Dockerfile
    restart: unless-stopped
    environment:
      PORT: "8300"
      WORKERS: "1"
      REGISTERED_PRODUCTS_PATH: /data/registered_products.jsonl
      PRESCRIPTIONS_PATH: /data/prescriptions.jsonl
      SESSION_EVENTS_PATH: /data/session_events.jsonl    # 세션 상태 이벤트 로그 (Jira 224) — 재시작 시 재생
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS:-}   # 행동 이벤트 구독 (Jira 226). 비우면 구독 안 함
      ACTIVITY_EVENTS_TOPIC: ${ACTIVITY_EVENTS_TOPIC:-activity-events}
      RECOMMEND_STATE_GROUP: recommend-state-v1          # Spark 와 다른 consumer group — 같은 이벤트를 독립적으로 읽는다
      GMS_KEY: ${GMS_KEY:-}                      # 처방 문장 생성 (없으면 /api/prescription 만 503)
      SHOP_BACKEND_URL: ${SHOP_BACKEND_URL:-http://shop-backend:8090}    # 쇼핑몰 백엔드 카탈로그 동기화 (Jira 222)
      CATALOG_SYNC_INTERVAL_SEC: ${CATALOG_SYNC_INTERVAL_SEC:-300}
      NEW_BRAND_DAYS: ${NEW_BRAND_DAYS:-14}                 # 신규 브랜드 = 등록 후 N일 (Jira 247-b, 2026-09-11 결정)
      # 장기 성향 long_term_trait (Jira 306). dw MySQL projection 이 생기면 DW_MYSQL_* 를 .env 에 채운다 (데이터 파트 09-22 확정 대기).
      # 비우면 /data/user_trait_snapshot.jsonl → 이미지 안 스냅샷 → 없으면 응답 null.
      DW_MYSQL_HOST: ${DW_MYSQL_HOST:-}
      DW_MYSQL_PORT: ${DW_MYSQL_PORT:-3306}
      DW_MYSQL_USER: ${DW_MYSQL_USER:-}
      DW_MYSQL_PASSWORD: ${DW_MYSQL_PASSWORD:-}
      DW_MYSQL_DB: ${DW_MYSQL_DB:-dw}
      USER_TRAIT_RELOAD_SEC: ${USER_TRAIT_RELOAD_SEC:-300}
      USER_TRAIT_STALE_DAYS: ${USER_TRAIT_STALE_DAYS:-2}
      USER_TRAIT_MAX_AGE_DAYS: ${USER_TRAIT_MAX_AGE_DAYS:-14}
      PRESCRIPTION_LLM: ${PRESCRIPTION_LLM:-on}
      DEMO_LIMIT: ${DEMO_LIMIT:-1000}
      DEMO_CACHE_DIR: /data/demo_cache
      DEMO_CURRENCY: ${DEMO_CURRENCY:-KRW}
      SPARK_MASTER_UI: ${SPARK_MASTER_UI:-}
      DASHBOARD_URL: ${DASHBOARD_URL:-}
      # /pipeline 의 dw 칸이 행 수를 세는 대상 (Jira 359). 비우면 pipeline_stats.py 내장 22종.
      # EC2-2 의 발행 대상과 같은 목록이어야 한다 — 다르면 발행은 됐는데 화면에 안 잡힌다.
      DW_PROJECTION_MARTS: ${DW_PROJECTION_MARTS:-}
      NEW_BRAND_ALWAYS_PREFIX: ${NEW_BRAND_ALWAYS_PREFIX:-SB}   # 기간 무관 신규로 둘 product_id 접두. SB = 시연 브랜드 SSAFY Beauty 8개 (2026-09-14 결정, Jira 249). 비우려면 .env 에 빈 값
      # 재학습 산출물 (deploy/ec2-1/retrain-ltr.sh → batch/jobs/retrain_ltr.py). 볼륨이 비어 있으면 이미지 안 모델.
      LTR_MODEL_DIR: /data/ltr
    volumes:
      - recommend-data:/data
    expose:
      - "8300"
    mem_limit: 3g

  nginx:
    build:
      context: ../..
      dockerfile: deploy/nginx.Dockerfile
      # Vite는 정적 번들 빌드 시점에 공개 결제 식별자를 주입한다.
      # PortOne Secret은 절대 프론트 빌드에 전달하지 않는다.
      args:
        VITE_PORTONE_STORE_ID: ${VITE_PORTONE_STORE_ID:-}
        VITE_PORTONE_CHANNEL_KEY: ${VITE_PORTONE_CHANNEL_KEY:-}
    restart: unless-stopped
    depends_on:
      - backend
      - shop-backend
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - type: bind
        source: ${CERTBOT_WEBROOT_PATH:-/opt/hwabun/certbot/www}
        target: /var/www/certbot
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${LETSENCRYPT_PATH:-/etc/letsencrypt}
        target: /etc/letsencrypt
        read_only: true
        bind:
          create_host_path: false
    mem_limit: 128m

  prometheus:
    image: prom/prometheus:v3.5.0
    restart: unless-stopped
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=7d
    ports:
      - "127.0.0.1:9090:9090"
    mem_limit: 512m

  grafana:
    image: grafana/grafana:12.1.0
    restart: unless-stopped
    depends_on:
      - prometheus
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?Set GRAFANA_ADMIN_PASSWORD in .env}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana-data:/var/lib/grafana
      - ../../monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ../../monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    mem_limit: 384m

volumes:
  prometheus-data:
  grafana-data:
  recommend-data:
  mysql-data:
