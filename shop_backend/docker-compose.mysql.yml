services:
  shop-backend-mysql:
    image: mysql:8.4
    container_name: shop-backend-mysql
    hostname: shop-backend-mysql
    restart: unless-stopped
    ports:
      - "${SHOP_BACKEND_MYSQL_PORT:-13306}:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${SHOP_BACKEND_MYSQL_ROOT_PASSWORD:-shop_backend_root_dev}
      MYSQL_DATABASE: ${SHOP_BACKEND_MYSQL_DATABASE:-shop_backend}
      MYSQL_USER: ${SHOP_BACKEND_MYSQL_USER:-shop_backend}
      MYSQL_PASSWORD: ${SHOP_BACKEND_MYSQL_PASSWORD:-shop_backend_dev}
    volumes:
      - shop-backend-mysql-data:/var/lib/mysql
      - ./mysql-erd.sql:/docker-entrypoint-initdb.d/001-mysql-erd.sql:ro
      - ./seed/shop_backend_seed.sql:/docker-entrypoint-initdb.d/002-shop-backend-seed.sql:ro
    networks:
      - shop-backend-db
    healthcheck:
      test:
        - CMD-SHELL
        - mysqladmin ping -h localhost -u root -p"$${MYSQL_ROOT_PASSWORD}" --silent
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

volumes:
  shop-backend-mysql-data:
    name: shop-backend-mysql-data

networks:
  shop-backend-db:
    name: shop-backend-db
