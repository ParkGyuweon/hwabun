spring:
  application:
    name: shop-backend
  datasource:
    url: ${SHOP_BACKEND_MYSQL_URL:jdbc:mysql://localhost:13306/shop_backend?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Seoul&connectionTimeZone=Asia/Seoul&forceConnectionTimeZoneToSession=true}
    username: ${SHOP_BACKEND_MYSQL_USER:shop_backend}
    password: ${SHOP_BACKEND_MYSQL_PASSWORD:shop_backend_dev}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

server:
  port: ${SERVER_PORT:8090}

# 로그인 JWT 만료 시간: 24시간
SHOP_BACKEND_JWT_EXPIRATION_MS: 86400000

recommendation:
  url: ${RECOMMEND_URL:http://localhost:8300}
  timeout-ms: ${RECOMMEND_TIMEOUT_MS:300}
  feedback-timeout-ms: ${RECOMMEND_FEEDBACK_TIMEOUT_MS:30000}

shop:
  feedback:
    classify:
      cron: ${SHOP_FEEDBACK_CLASSIFY_CRON:0 0 6 * * *}
      batch-size: ${SHOP_FEEDBACK_CLASSIFY_BATCH_SIZE:200}
  test-pay:
    allowed-member-prefix: ${TEST_PAY_ALLOWED_MEMBER_PREFIX:}
  payment:
    # 결제 대조: confirm 이 실패·누락된 CREATED 주문을 PortOne 에 다시 물어 PAID 로 맞춘다.
    # PORTONE_API_SECRET 이 비어 있으면 enabled 여도 돌지 않는다(로컬 개발 기본).
    reconcile:
      enabled: ${SHOP_PAYMENT_RECONCILE_ENABLED:true}
      interval-ms: ${SHOP_PAYMENT_RECONCILE_INTERVAL_MS:300000}
      initial-delay-ms: ${SHOP_PAYMENT_RECONCILE_INITIAL_DELAY_MS:60000}
      min-age-seconds: ${SHOP_PAYMENT_RECONCILE_MIN_AGE_SECONDS:120}
      max-age-hours: ${SHOP_PAYMENT_RECONCILE_MAX_AGE_HOURS:24}
      batch-size: ${SHOP_PAYMENT_RECONCILE_BATCH_SIZE:50}

portone:
  api-url: ${PORTONE_API_URL:https://api.portone.io}
  timeout-ms: ${PORTONE_TIMEOUT_MS:10000}

# 결제 없이 PAID 로 표시하는 테스트 주문(POST /api/orders/{id}/pay)을 부를 수 있는 회원.
# 이 경로는 에이전트 러너 전용이다 — PA 러너는 카카오페이 창(카카오 로그인·QR)을 자동화로 넘을 수 없어
# 이 길로 주문을 끝내야 재구매 지표가 잡힌다.
# 프론트의 ?pay=test·navigator.webdriver 판정은 보호 장치가 아니다. 로그인한 사람이면 누구나 토큰으로
# 이 엔드포인트를 직접 부를 수 있어서, 실제 차단은 여기서 한다.
# 빈 값이면 제한하지 않는다 — 로컬 개발은 막히면 안 된다. 배포에서만 PA 로 채운다.
management:
  metrics:
    tags:
      application: ${spring.application.name}
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
