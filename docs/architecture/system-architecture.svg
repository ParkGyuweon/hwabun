  <g filter="url(#shadow)"><rect x="390" y="465" width="190" height="220" rx="20" class="card"/></g>
  <text x="485" y="515" text-anchor="middle" class="t h">Event API</text><text x="485" y="548" text-anchor="middle" class="t p">Spring Boot</text>
  <!-- Embedded Spring Boot mark; source copy kept in assets/ for maintenance. -->
  <image x="441" y="570" width="88" height="88" href="data:image/svg+xml;base64,"/>

  <!-- Inline vector mark avoids nested-SVG clipping in presentation renderers. -->
  <g transform="translate(441 570) scale(3.6666667)" aria-label="Spring Boot">
    <path d="m23.693 10.7058-4.73-8.1844c-.4094-.7106-1.4166-1.2942-2.2402-1.2942H7.2725c-.819 0-1.8308.5836-2.2402 1.2942L.307 10.7058c-.4095.7106-.4095 1.873 0 2.5837l4.7252 8.189c.4094.7107 1.4166 1.2943 2.2402 1.2943h9.455c.819 0 1.826-.5836 2.2402-1.2942l4.7252-8.189c.4095-.7107.4095-1.8732 0-2.5838zM10.9763 5.7547c0-.5365.4377-.9742.9742-.9742s.9742.4377.9742.9742v5.8217c0 .5366-.4377.9742-.9742.9742s-.9742-.4376-.9742-.9742zm.9742 12.4294c-3.6427 0-6.6077-2.965-6.6077-6.6077.0047-2.0896.993-4.0521 2.6685-5.304a.8657.8657 0 0 1 1.2142.1788.8657.8657 0 0 1-.1788 1.2143c-2.1602 1.6048-2.612 4.6592-1.0072 6.8194 1.6049 2.1603 4.6593 2.612 6.8195 1.0072 1.2378-.9177 1.9673-2.372 1.9673-3.9157a4.8972 4.8972 0 0 0-1.9861-3.925c-.386-.2824-.466-.8284-.1836-1.2143.2824-.386.8283-.466 1.2143-.1835 1.6895 1.2471 2.6826 3.2238 2.6873 5.3228 0 3.6474-2.965 6.6077-6.6077 6.6077z" fill="#6DB33F"/>
  </g>
  <!-- Presentation-safe Spring Boot power mark. -->
  <g aria-label="Spring Boot logo">
    <polygon points="485,570 529,595 529,634 485,659 441,634 441,595" fill="#6DB33F"/>
    <rect x="479" y="586" width="12" height="31" rx="6" fill="#ffffff"/>
    <path d="M470 604 C460 628 474 642 485 642 C496 642 510 628 500 604" fill="none" stroke="#ffffff" stroke-width="9" stroke-linecap="round"/>
  </g>
  <!-- Reusable local asset: keep this reference rather than embedding the mark. -->
  <rect x="438" y="567" width="94" height="95" fill="#ffffff"/>
  <image x="441" y="570" width="88" height="89" href="assets/spring-boot.svg" preserveAspectRatio="xMidYMid meet"/>

  <!-- Kafka -->
  <g filter="url(#shadow)"><rect x="620" y="465" width="210" height="220" rx="20" fill="#fff" stroke="#fb923c" stroke-width="2.5"/></g>
  <image x="690" y="472" width="70" height="70" href="assets/kafka.png" preserveAspectRatio="xMidYMid meet"/>
  <text x="725" y="553" text-anchor="middle" class="t p">activity-events</text>
  <g fill="#fff7ed" stroke="#fb923c" stroke-width="2"><rect x="646" y="562" width="158" height="29" rx="8"/><rect x="646" y="603" width="158" height="29" rx="8"/><rect x="646" y="644" width="158" height="29" rx="8"/></g>
  <text x="662" y="582" class="t s">Partition 0</text><text x="662" y="623" class="t s">Partition 1</text><text x="662" y="664" class="t s">Partition 2</text>
  <g fill="#fb923c"><circle cx="764" cy="577" r="3.5"/><circle cx="777" cy="577" r="3.5"/><circle cx="790" cy="577" r="3.5"/><circle cx="764" cy="618" r="3.5"/><circle cx="777" cy="618" r="3.5"/><circle cx="790" cy="618" r="3.5"/><circle cx="764" cy="659" r="3.5"/><circle cx="777" cy="659" r="3.5"/><circle cx="790" cy="659" r="3.5"/></g>

  <!-- Spark -->
  <g filter="url(#shadow)"><rect x="870" y="465" width="230" height="220" rx="20" fill="#fff" stroke="#fbbf24" stroke-width="2.5"/></g>
  <image x="925" y="480" width="120" height="54" href="assets/spark.png" preserveAspectRatio="xMidYMid meet"/>
  <rect x="892" y="557" width="186" height="46" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="2"/><polygon points="912,570 912,590 930,580" fill="none" stroke="#a16207" stroke-width="2.5"/><text x="948" y="587" class="t" style="font-size:16px;font-weight:700;fill:#334155">Q1 Streaming</text>
  <rect x="892" y="620" width="186" height="46" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="2"/><rect x="910" y="632" width="21" height="21" rx="3" fill="none" stroke="#a16207" stroke-width="2"/><line x1="915" y1="628" x2="915" y2="636" stroke="#a16207" stroke-width="2"/><line x1="926" y1="628" x2="926" y2="636" stroke="#a16207" stroke-width="2"/><text x="948" y="650" class="t" style="font-size:16px;font-weight:700;fill:#334155">Q2~Q4 Batch</text>

  <!-- Storage -->
  <g filter="url(#shadow)"><rect x="1140" y="445" width="260" height="265" rx="20" fill="#fff" stroke="#2563eb" stroke-width="2.5"/></g>
  <text x="1270" y="494" text-anchor="middle" class="t h">DB / DW</text>
  <ellipse cx="1270" cy="546" rx="82" ry="20" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><path d="M1188 546v112c0 11 37 20 82 20s82-9 82-20V546" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><path d="M1188 580c0 11 37 20 82 20s82-9 82-20M1188 621c0 11 37 20 82 20s82-9 82-20" fill="none" stroke="#2563eb" stroke-width="2"/><path d="M1188 621v37c0 11 37 20 82 20s82-9 82-20v-37" fill="#1d4ed8" stroke="#2563eb" stroke-width="2"/>
  <text x="1270" y="572" text-anchor="middle" class="t" style="font-size:16px;font-weight:700;fill:#334155">Raw</text><text x="1270" y="614" text-anchor="middle" class="t" style="font-size:16px;font-weight:700;fill:#334155">Processed</text><text x="1270" y="653" text-anchor="middle" class="t" style="font-size:16px;font-weight:700;fill:#fff">Mart</text>

  <!-- Backend and dashboard -->
  <g filter="url(#shadow)"><rect x="1450" y="465" width="190" height="220" rx="20" class="card"/></g><text x="1545" y="515" text-anchor="middle" class="t h">Backend API</text><circle cx="1545" cy="596" r="42" fill="#eff6ff" stroke="#2563eb" stroke-width="3"/><circle cx="1545" cy="596" r="18" fill="none" stroke="#2563eb" stroke-width="3"/><g stroke="#2563eb" stroke-width="4"><path d="M1545 543v16m0 74v16m-53-53h16m74 0h16m-90-37 11 11m52 52 11 11m0-74-11 11m-52 52-11 11"/></g><text x="1545" y="603" text-anchor="middle" class="t" style="font-size:16px;font-weight:700;fill:#334155">API</text>
  <g filter="url(#shadow)"><rect x="1680" y="465" width="190" height="220" rx="20" class="card"/></g><text x="1775" y="515" text-anchor="middle" class="t h">HWABUN</text><text x="1775" y="546" text-anchor="middle" class="t h">Dashboard</text><rect x="1720" y="574" width="110" height="74" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="3"/><circle cx="1750" cy="610" r="19" fill="none" stroke="#2563eb" stroke-width="3"/><path d="M1750 591v19h18" fill="none" stroke="#2563eb" stroke-width="3"/><path d="M1784 629v-13m17 13v-28m17 28v-20" stroke="#2563eb" stroke-width="7"/>

  <!-- Future serving DB/cache -->
  <path d="M1545 685v85" class="future"/><rect x="1428" y="780" width="234" height="126" rx="18" fill="#fff" stroke="#2563eb" stroke-width="2.5" stroke-dasharray="8 7"/><ellipse cx="1545" cy="809" rx="28" ry="9" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><path d="M1517 809v29c0 5 13 9 28 9s28-4 28-9v-29" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><path d="M1517 824c0 5 13 9 28 9s28-4 28-9" fill="none" stroke="#2563eb" stroke-width="2"/><text x="1545" y="878" text-anchor="middle" class="t" style="font-size:20px;font-weight:700;fill:#1d4ed8">Serving DB / Cache</text>

  <!-- Recommendation feedback -->
  <path d="M1270 710v126h-218" class="feedback"/>
  <g filter="url(#shadow)"><rect x="760" y="765" width="292" height="150" rx="20" fill="#fff" stroke="#7c3aed" stroke-width="2.5"/></g><text x="906" y="816" text-anchor="middle" class="t" style="font-size:22px;font-weight:700;fill:#6d28d9">Recommendation Model</text>
  <path d="M865 851c-13-17-35-5-28 12-17 3-16 27 3 29 7 15 31 12 33-4 15 9 30-10 17-22 8-18-15-31-25-15z" fill="#f3e8ff" stroke="#7c3aed" stroke-width="2.5"/><circle cx="856" cy="866" r="4" fill="#7c3aed"/><circle cx="875" cy="858" r="4" fill="#7c3aed"/><circle cx="880" cy="879" r="4" fill="#7c3aed"/><path d="m890 855 28-14m-28 31 28 15" stroke="#7c3aed" stroke-width="3"/><circle cx="925" cy="838" r="6" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/><circle cx="925" cy="890" r="6" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
  <path d="M760 840H220V706" class="feedback"/><rect x="380" y="817" width="115" height="35" rx="17" fill="#fff" stroke="#7c3aed" stroke-width="2"/><text x="437" y="841" text-anchor="middle" class="t" style="font-size:16px;font-weight:700;fill:#6d28d9">추천 결과</text>

  <!-- Legend and footer -->
  <g transform="translate(1670 910)"><rect width="200" height="100" rx="14" fill="#fff" stroke="#cbd5e1" stroke-width="2"/><path d="M24 35h60" class="line" style="stroke-width:4"/><text x="104" y="41" class="t" style="font-size:16px;font-weight:700;fill:#334155">현재 구현</text><path d="M24 72h60" class="future"/><text x="104" y="78" class="t" style="font-size:16px;font-weight:700;fill:#334155">향후 서빙 연동</text></g>
  <text x="80" y="1008" class="t sub">행동 Event는 Streaming으로 수집·Raw 적재하고, 누적 데이터는 Batch 정제로 분석·추천에 활용합니다.</text>
</svg>
