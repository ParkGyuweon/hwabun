<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" role="img" aria-labelledby="title desc">
  <title id="title">HWABUN System Architecture</title>
  <desc id="desc">Persona generated behavior flows through BLOOM, Event API, Kafka, Spark, DB and DW, and the dashboard. The recommendation model feeds results back to BLOOM.</desc>
  <defs>
    <style>
      .t{font-family:'Pretendard','Apple SD Gothic Neo','Malgun Gothic',sans-serif}.title{font-size:40px;font-weight:700;fill:#172554}.sub{font-size:19px;fill:#64748b}.h{font-size:25px;font-weight:700;fill:#1d4ed8}.p{font-size:18px;font-weight:500;fill:#334155}.s{font-size:15px;font-weight:500;fill:#475569}.w{fill:#fff}.card{fill:#fff;stroke:#cbd5e1;stroke-width:2}.line{fill:none;stroke:#2563eb;stroke-width:4;marker-end:url(#a)}.feedback{fill:none;stroke:#7c3aed;stroke-width:4;marker-end:url(#ap)}.future{fill:none;stroke:#2563eb;stroke-width:3;stroke-dasharray:8 7;marker-end:url(#a)}
    </style>
    <filter id="shadow" x="-15%" y="-15%" width="130%" height="140%"><feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#0f172a" flood-opacity=".12"/></filter>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 10 5 0 10z" fill="#2563eb"/></marker>
    <marker id="ap" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 10 5 0 10z" fill="#7c3aed"/></marker>
  </defs>

  <rect width="1920" height="1080" fill="#f8fafc"/>
  <rect width="1920" height="112" fill="#fff"/>
  <line x1="70" y1="112" x2="1850" y2="112" stroke="#e2e8f0" stroke-width="2"/>
  <text x="80" y="62" class="t title">HWABUN System Architecture</text>
  <text x="80" y="94" class="t sub">실시간 행동 Event 수집 · 배치 정제 · 추천 피드백 구조</text>

  <!-- Persona -->
  <g filter="url(#shadow)"><rect x="60" y="155" width="320" height="218" rx="20" fill="#fff" stroke="#2563eb" stroke-width="2.5"/></g>
  <text x="220" y="202" text-anchor="middle" class="t h">Persona 생성</text>
  <line x1="60" y1="224" x2="380" y2="224" stroke="#dbeafe" stroke-width="2"/>
  <rect x="105" y="246" width="48" height="38" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <rect x="116" y="255" width="26" height="16" rx="2" fill="none" stroke="#2563eb" stroke-width="2"/><line x1="129" y1="271" x2="129" y2="279" stroke="#2563eb" stroke-width="2"/><line x1="120" y1="279" x2="138" y2="279" stroke="#2563eb" stroke-width="2"/>
  <text x="172" y="273" class="t p">PC 행동 생성기</text>
  <line x1="105" y1="306" x2="355" y2="306" stroke="#e2e8f0" stroke-width="2"/>
  <rect x="105" y="318" width="48" height="38" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/><circle cx="129" cy="337" r="12" fill="none" stroke="#2563eb" stroke-width="2"/><path d="M117 337h24M129 325c-4 4-4 20 0 24M129 325c4 4 4 20 0 24" fill="none" stroke="#2563eb" stroke-width="1.7"/>
  <text x="172" y="344" class="t p">PA 브라우저 에이전트</text>
  <path d="M220 373V430" class="line"/>

  <!-- Main flow arrows -->
  <path d="M360 577H390" class="line"/><path d="M580 577H620" class="line"/><path d="M830 577H870" class="line"/><path d="M1100 577H1140" class="line"/><path d="M1400 577H1450" class="line"/><path d="M1640 577H1680" class="line"/>

  <!-- BLOOM -->
  <g filter="url(#shadow)"><rect x="80" y="448" width="280" height="258" rx="20" fill="#fff" stroke="#1d4ed8" stroke-width="3"/></g>
  <text x="220" y="496" text-anchor="middle" class="t h">BLOOM Frontend</text><text x="220" y="528" text-anchor="middle" class="t p">React · TypeScript</text>
  <rect x="135" y="559" width="170" height="102" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="3"/><line x1="135" y1="584" x2="305" y2="584" stroke="#2563eb" stroke-width="3"/><circle cx="150" cy="571" r="4" fill="#2563eb"/><circle cx="164" cy="571" r="4" fill="#60a5fa"/><rect x="157" y="603" width="52" height="37" rx="3" fill="#dbeafe"/><path d="m221 637 23-23 18 17 17-22 17 28z" fill="#bfdbfe"/><path d="M220 661v24M185 685h70" stroke="#2563eb" stroke-width="3"/>

