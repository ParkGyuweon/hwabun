spring:
  application:
    name: log-connector
  jackson:
    property-naming-strategy: SNAKE_CASE
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    admin:
      fail-fast: false
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
      batch-size: 65536
      properties:
        enable.idempotence: true
        compression.type: lz4
        linger.ms: 10
        delivery.timeout.ms: 10000
        request.timeout.ms: 5000
        max.block.ms: 5000

collector:
  kafka:
    topic: ${ACTIVITY_EVENTS_TOPIC:activity-events}
    partitions: ${ACTIVITY_EVENTS_PARTITIONS:3}
    replication-factor: ${KAFKA_TOPIC_REPLICATION_FACTOR:1}
    retention-ms: ${KAFKA_TOPIC_RETENTION_MS:86400000}
    create-topic: ${CREATE_ACTIVITY_EVENTS_TOPIC:false}
    publisher-executor:
      core-pool-size: ${KAFKA_PUBLISHER_CORE_POOL_SIZE:16}
      max-pool-size: ${KAFKA_PUBLISHER_MAX_POOL_SIZE:32}
      queue-capacity: ${KAFKA_PUBLISHER_QUEUE_CAPACITY:200}
      max-in-flight-batches: ${KAFKA_PUBLISHER_MAX_IN_FLIGHT_BATCHES:232}
  http:
    max-event-request-bytes: ${MAX_EVENT_REQUEST_BYTES:262144}
  allowed-origins: ${ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
  metrics:
    tags:
      application: ${spring.application.name}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
