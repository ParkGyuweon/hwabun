# Common local-development defaults. Job-specific paths and Kafka options are
# passed by the runner so Q1 and batch jobs can stay independently runnable.
spark.master                              spark://spark-master:7077
spark.submit.deployMode                   client
spark.sql.session.timeZone                UTC
spark.eventLog.enabled                    true
spark.eventLog.dir                        file:/opt/spark-events
spark.history.fs.logDirectory             file:/opt/spark-events
spark.sql.adaptive.enabled                true
spark.sql.shuffle.partitions              4
spark.serializer                          org.apache.spark.serializer.KryoSerializer
spark.driver.memory                       1g
spark.executor.memory                     1g
spark.executor.cores                      1
spark.streaming.stopGracefullyOnShutdown  true
